apiVersion: 1
datasources:
  - name: AGV TimescaleDB
    uid: agv-timescale
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: $POSTGRES_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
    secureJsonData:
      password: $POSTGRES_PASSWORD
