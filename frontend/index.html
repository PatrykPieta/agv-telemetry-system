<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin AGV - Three.js</title>
    <link rel="stylesheet" href="styles.css?v=2">
   <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "lil-gui": "https://unpkg.com/lil-gui@0.19/dist/lil-gui.esm.js"
          }
        }
    </script>
</head>
<body>

    <div class="app-container">
        
        <div class="left-pane" style="position: relative;">
            <div id="scene-container"></div>
            
           <div id="ui-overlay" style="position: absolute; top: 15px; left: 15px; z-index: 9999; background: rgba(15, 15, 15, 0.85); padding: 15px; border-radius: 8px; border: 1px solid #444; color: white;">
                <h2 style="margin-top: 0; font-size: 18px;">Digital Twin AGV</h2>
                <p>Status: <span id="status" class="status-offline">Łączenie...</span></p>
                
                <p>Zegar: <span id="ui-clock" style="font-family: monospace; color: #00ff00;">--:--:--</span></p>
                
                <p>Przednie lewe koło: <span id="ui-rpm">—</span> RPM</p>
                <p>Bateria: <span id="ui-volt">—</span> V</p>
                <p id="ui-alert" role="status">Brak bieżących ostrzeżeń</p>

                <button id="camera-toggle" style="margin-top: 10px; width: 100%; padding: 8px 10px; cursor: pointer; background-color: #333; color: #00ff00; border: 1px solid #555; border-radius: 4px; font-weight: bold;">
                    🔓 Odłącz kamerę
                </button>
                <button id="scene-options" aria-expanded="false" style="margin-top: 8px; width: 100%; padding: 6px;">Ustawienia sceny</button>
            </div>

            <div id="performance-monitor" style="position: absolute; top: 20px; right: 20px; color: #00ff00; background: rgba(0,0,0,0.8); padding: 10px; font-family: monospace; z-index: 100; pointer-events: none; border-radius: 5px; border: 1px solid #00ff00; font-size: 14px;">
                Inicjalizacja metryk...
            </div>
        </div>

        <div class="control-panel">
            <h2>KOKPIT OPERATORSKI IIoT</h2>
            <hr>
            
            <div class="grafana-card">
                <h4>Prędkość Obrotowa Kół (RPM)</h4>
                <iframe data-panel="8" title="Prędkości kół" width="100%" height="220" frameborder="0"></iframe>
            </div>

            <div class="grafana-card">
                <h4>Temperatura silników (°C)</h4>
                <iframe data-panel="9" title="Temperatury silników" width="100%" height="220" frameborder="0"></iframe>
            </div>
        </div>

    </div>

    <script type="module" src="js/main.js?v=2"></script>
    <script type="module">
        const config = await fetch('/api/config').then(response => response.json());
        document.querySelectorAll('iframe[data-panel]').forEach(frame => {
            const url = new URL('/d-solo/agv-system/agv', location.href);
            url.port = '3000';
            url.search = new URLSearchParams({ orgId: '1', from: 'now-5m', to: 'now',
                panelId: frame.dataset.panel, refresh: '5s', 'var-agv': config.agv_id });
            frame.src = url.href;
        });
    </script>
</body>
</html>
